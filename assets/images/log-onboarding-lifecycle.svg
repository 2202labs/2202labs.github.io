<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Splunk log onboarding lifecycle</title>
  <desc id="desc">Six stages move from reporting intent through source classification, requirements, controlled validation, governance decision, and operational handover, with evidence and ownership maintained throughout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111f36"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020817" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42c8b4"/>
    </marker>
    <style>
      .stage { fill: #142841; stroke: #355774; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .number { fill: #42c8b4; font: 700 15px Segoe UI, Arial, sans-serif; letter-spacing: 1px; }
      .heading { fill: #f5f9ff; font: 700 21px Segoe UI, Arial, sans-serif; }
      .body { fill: #b9c8d8; font: 15px Segoe UI, Arial, sans-serif; }
      .arrow { fill: none; stroke: #42c8b4; stroke-width: 3; marker-end: url(#arrow); }
      .band-title { fill: #8ee6d7; font: 700 16px Segoe UI, Arial, sans-serif; letter-spacing: 1.2px; }
      .band-body { fill: #d6e2ee; font: 16px Segoe UI, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="54" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Log onboarding: from reporting intent to operational ownership</text>
  <text x="60" y="84" fill="#8fa5bb" font-family="Segoe UI, Arial, sans-serif" font-size="16">A public-safe lifecycle reconstructed from the delivery method; all labels are generic.</text>

  <rect class="stage" x="60" y="125" width="320" height="125"/>
  <text class="number" x="84" y="154">01 · INTENT</text>
  <text class="heading" x="84" y="186">Define the outcome</text>
  <text class="body" x="84" y="216">Report, investigation, monitoring,</text>
  <text class="body" x="84" y="237">or audit need to be supported.</text>

  <path class="arrow" d="M 390 187 H 430"/>
  <rect class="stage" x="440" y="125" width="320" height="125"/>
  <text class="number" x="464" y="154">02 · CLASSIFY</text>
  <text class="heading" x="464" y="186">Map source and use cases</text>
  <text class="body" x="464" y="216">Classify OS, DB, or application;</text>
  <text class="body" x="464" y="237">select applicable security outcomes.</text>

  <path class="arrow" d="M 770 187 H 810"/>
  <rect class="stage" x="820" y="125" width="320" height="125"/>
  <text class="number" x="844" y="154">03 · REQUIREMENTS</text>
  <text class="heading" x="844" y="186">Specify usable evidence</text>
  <text class="body" x="844" y="216">Required events, fields, timestamps,</text>
  <text class="body" x="844" y="237">volume, parsing, and attribution.</text>

  <path class="arrow" d="M 980 260 V 292"/>
  <rect class="stage" x="820" y="305" width="320" height="125"/>
  <text class="number" x="844" y="334">04 · VALIDATE</text>
  <text class="heading" x="844" y="366">Generate and verify</text>
  <text class="body" x="844" y="396">Use controlled representative activity;</text>
  <text class="body" x="844" y="417">confirm searchability and quality.</text>

  <path class="arrow" d="M 810 367 H 770"/>
  <rect class="stage" x="440" y="305" width="320" height="125"/>
  <text class="number" x="464" y="334">05 · GOVERN</text>
  <text class="heading" x="464" y="366">Approve controls</text>
  <text class="body" x="464" y="396">Retention, access, ownership, health</text>
  <text class="body" x="464" y="417">checks, and accepted exceptions.</text>

  <path class="arrow" d="M 430 367 H 390"/>
  <rect class="stage" x="60" y="305" width="320" height="125"/>
  <text class="number" x="84" y="334">06 · HANDOVER</text>
  <text class="heading" x="84" y="366">Transfer operational context</text>
  <text class="body" x="84" y="396">Inventory, evidence references, support</text>
  <text class="body" x="84" y="417">route, acceptance, and review trigger.</text>

  <rect x="60" y="474" width="1080" height="52" rx="12" fill="#102f3a" stroke="#287d78" stroke-width="1.5"/>
  <text class="band-title" x="84" y="506">CONTINUOUS CONTROL</text>
  <text class="band-body" x="284" y="506">Evidence references · named owners · explicit decisions · material-change review</text>
</svg>

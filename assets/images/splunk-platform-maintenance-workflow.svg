<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Node-level Splunk Enterprise upgrade workflow</title>
  <desc id="desc">A Windows upgrade flow moves from version detection and prechecks through backup, unattended MSI installation, service recovery, verification, and operator-controlled progression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1728"/><stop offset="1" stop-color="#111f36"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020817" flood-opacity="0.36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42c8b4"/></marker>
    <style>
      .gate{fill:#142841;stroke:#355774;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .role{fill:#102f3a;stroke:#287d78;stroke-width:1.3;rx:12}
      .number{fill:#42c8b4;font:700 14px Segoe UI,Arial,sans-serif;letter-spacing:1px}
      .heading{fill:#f5f9ff;font:700 20px Segoe UI,Arial,sans-serif}
      .body{fill:#b9c8d8;font:14px Segoe UI,Arial,sans-serif}
      .role-text{fill:#d6e2ee;font:600 15px Segoe UI,Arial,sans-serif}
      .arrow{fill:none;stroke:#42c8b4;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="610" rx="24" fill="url(#bg)"/>
  <text x="60" y="54" fill="#f5f9ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Node-level Splunk upgrade with operator-controlled progression</text>
  <text x="60" y="84" fill="#8fa5bb" font-family="Segoe UI, Arial, sans-serif" font-size="16">Production-used Windows workflow; internal commands, hosts, and configuration values are intentionally omitted.</text>
  <rect class="gate" x="60" y="125" width="300" height="122"/>
  <text class="number" x="84" y="154">01 · DETECT</text><text class="heading" x="84" y="186">Identify versions</text>
  <text class="body" x="84" y="216">Detect installed and target</text><text class="body" x="84" y="237">Splunk Enterprise versions.</text>
  <path class="arrow" d="M 370 186 H 425"/>
  <rect class="gate" x="435" y="125" width="300" height="122"/>
  <text class="number" x="459" y="154">02 · PRECHECK</text><text class="heading" x="459" y="186">Validate the installer</text>
  <text class="body" x="459" y="216">Confirm the Windows host and</text><text class="body" x="459" y="237">upgrade package are ready.</text>
  <path class="arrow" d="M 745 186 H 800"/>
  <rect class="gate" x="810" y="125" width="330" height="122"/>
  <text class="number" x="834" y="154">03 · PROTECT</text><text class="heading" x="834" y="186">Back up Splunk state</text>
  <text class="body" x="834" y="216">Stop Splunk and protect important</text><text class="body" x="834" y="237">configuration and operational state.</text>
  <rect class="role" x="830" y="279" width="142" height="48"/><text class="role-text" x="901" y="309" text-anchor="middle">Role wrapper</text>
  <rect class="role" x="984" y="279" width="136" height="48"/><text class="role-text" x="1052" y="309" text-anchor="middle">Scheduled Task</text>
  <rect class="role" x="830" y="339" width="142" height="48"/><text class="role-text" x="901" y="369" text-anchor="middle">Backup state</text>
  <rect class="role" x="984" y="339" width="136" height="48"/><text class="role-text" x="1052" y="369" text-anchor="middle">Capture logs</text>
  <path class="arrow" d="M 975 397 V 426"/>
  <rect class="gate" x="810" y="438" width="330" height="122"/>
  <text class="number" x="834" y="467">04 · UPGRADE</text><text class="heading" x="834" y="499">Run the Windows MSI</text>
  <text class="body" x="834" y="529">Install unattended and retain MSI</text><text class="body" x="834" y="550">output for troubleshooting.</text>
  <path class="arrow" d="M 800 499 H 745"/>
  <rect class="gate" x="435" y="438" width="300" height="122"/>
  <text class="number" x="459" y="467">05 · RECOVER</text><text class="heading" x="459" y="499">Restart and recover</text>
  <text class="body" x="459" y="529">Restart Splunk, with Windows Service</text><text class="body" x="459" y="550">Control fallback when required.</text>
  <path class="arrow" d="M 425 499 H 370"/>
  <rect class="gate" x="60" y="438" width="300" height="122"/>
  <text class="number" x="84" y="467">06 · VERIFY</text><text class="heading" x="84" y="499">Check and summarize</text>
  <text class="body" x="84" y="529">Verify service, version, ports,</text><text class="body" x="84" y="550">checkpoints, and final summary.</text>
  <path d="M 210 428 V 274 H 795" fill="none" stroke="#5f7892" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="230" y="300" fill="#8fa5bb" font-family="Segoe UI, Arial, sans-serif" font-size="14">Operator reviews the result before starting the next platform component</text>
</svg>

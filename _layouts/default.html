<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.collection == 'articles' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.social_image | default: site.logo | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <script defer src="{{ '/assets/js/portfolio.js' | relative_url }}"></script>
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <dialog id="entrance" aria-label="2202 Labs introduction">
    <div class="entrance-title">2202 Labs<span></span><small>Infrastructure / Logging / Automation</small></div>
    <button id="skip-intro" type="button">Skip intro →</button>
  </dialog>
  {% include header.html %}
  <main id="main-content" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  <dialog id="search-dialog" aria-label="Search portfolio">
    <div class="search-top"><h2>Search</h2><button id="close-search" type="button" aria-label="Close search">×</button></div>
    <input id="search-input" type="search" placeholder="Search projects, articles, topics..." autocomplete="off">
    <div id="search-results"></div>
    <p class="search-hint">Ctrl/⌘ K opens search. Escape closes it.</p>
  </dialog>
  <script>
    window.portfolioSearchIndex = [
      {% for item in site.data.navigation %}
        { title: {{ item.label | jsonify }}, type: "PAGE", href: {{ item.url | relative_url | jsonify }} },
      {% endfor %}
      {% assign published_articles = site.articles | where_exp: 'article', 'article.status == "ready" or article.status == "published"' %}
      {% for article in published_articles %}
        { title: {{ article.title | jsonify }}, type: "ARTICLE", href: {{ article.url | relative_url | jsonify }}, keywords: {{ article.summary | default: article.description | append: ' ' | append: article.primary_domain | append: ' ' | append: article.secondary_domains | append: ' ' | append: article.topics | jsonify }} },
      {% endfor %}
      {% for project in site.static_files %}
        {% if project.path contains '/projects/' and project.extname == '.html' %}
          { title: {{ project.basename | replace: '-', ' ' | capitalize | jsonify }}, type: "PROJECT", href: {{ project.path | relative_url | jsonify }} },
        {% endif %}
      {% endfor %}
      {% for topic in site.data.topics %}
        { title: {{ topic | replace: '-', ' ' | capitalize | jsonify }}, type: "TOPIC", href: {{ '/?topic=' | append: topic | append: '#articles' | relative_url | jsonify }}, topic: {{ topic | jsonify }} },
      {% endfor %}
    ];
  </script>
</body>
</html>
